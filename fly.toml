# Cite backend API on Fly.io
# Deploy: flyctl launch --no-deploy  (first time) then flyctl deploy
# Or:     flyctl apps create cite-api && flyctl deploy

app = "cite-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  NODE_ENV = "production"
  # Set CORS_ORIGIN after the Vercel URL is known, e.g.:
  # flyctl secrets set CORS_ORIGIN=https://cite-xxx.vercel.app,https://*.vercel.app
  # Vercel preview hosts are also allowed in code via *.vercel.app

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
