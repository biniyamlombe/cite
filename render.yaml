# Cite API on Render (free Node web service)
# https://dashboard.render.com → New → Blueprint → connect biniyamlombe/hacknation702
services:
  - type: web
    name: cite-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build -w shared
    startCommand: npm run start -w backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # Optional after Vercel URL exists:
      # - key: CORS_ORIGIN
      #   value: https://YOUR-APP.vercel.app
